[web]
host = 0.0.0.0
port = 18080

[mqtt]
broker = 127.0.0.1
port = 1883
topic = device/zm1/#
user =
password =

[storage]
db_file = sensor_history.db
# 采样记录间隔 (秒)，600 = 10分钟
interval_seconds = 600
# 历史保留天数
retention_days = 7

[outdoor]
# 是否开启获取室外空气质量
enabled = true
# 填写你在 aqicn.org 申请的 token，测试时可暂用 demo
token = demo
# 监测城市名称 (如 shanghai, beijing)
city = shanghai
# 数据更新间隔 (秒)，默认半小时
refresh_interval = 1800
